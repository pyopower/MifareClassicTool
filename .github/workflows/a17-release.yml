name: MCT A17 release

# Builds a signed "MCT A17" APK and publishes it as a GitHub release.
# Trigger: push a tag like "a17-v4.3.1-1" (or run it by hand to just get
# the APK as an artifact).

on:
  push:
    tags:
      - "a17-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_PATH: Mifare Classic Tool

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          A17_KEYSTORE_B64: ${{ secrets.A17_KEYSTORE_B64 }}
        run: |
          test -n "$A17_KEYSTORE_B64" || { echo "Missing secret A17_KEYSTORE_B64"; exit 1; }
          echo "$A17_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mct-a17.jks"

      - name: Build signed APK
        working-directory: ${{ env.PROJECT_PATH }}
        env:
          A17_KEYSTORE: ${{ runner.temp }}/mct-a17.jks
          A17_KEYSTORE_PASSWORD: ${{ secrets.A17_KEYSTORE_PASSWORD }}
          A17_KEY_ALIAS: mcta17
          A17_VERSION_CODE: ${{ 7000 + github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        id: apk
        run: |
          NAME="MCT-A17-${GITHUB_REF_NAME#a17-}.apk"
          [ "$GITHUB_REF_TYPE" = tag ] || NAME="MCT-A17-${GITHUB_SHA::7}.apk"
          cp "$PROJECT_PATH/app/build/outputs/apk/release/app-release.apk" "$NAME"
          sha256sum "$NAME" | tee "$NAME.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: mct-a17-apk
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: MCT A17 ${{ github.ref_name }}
          files: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256
          generate_release_notes: true
          body: |
            MIFARE Classic Tool for Android 17, built from the `android17` branch.

            Installs as a separate app ("MCT A17", `de.syss.MifareClassicTool.a17`)
            next to the official MCT. See the commit history of this branch for
            the list of changes.

plugins {
    id 'com.android.application' version '9.2.0'
    id 'org.jetbrains.kotlin.android' version '2.2.10'
}

android {
    compileSdk 35
    namespace "de.syss.MifareClassicTool"

    defaultConfig {
        applicationId "de.syss.MifareClassicTool"
        applicationIdSuffix ".a17"
        versionNameSuffix "-a17"
        resValue "string", "app_name_a17", "MCT A17"
        minSdk 19
        targetSdk 35
        // A17 build: CI passes a growing version code per release.
        versionCode((System.getenv("A17_VERSION_CODE") ?: "70") as int)
        versionName '4.3.1'
    }

    signingConfigs {
        a17 {
            // Release signing from environment (GitHub Actions secrets or
            // local), see .github/workflows/a17-release.yml.
            def ks = System.getenv("A17_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("A17_KEYSTORE_PASSWORD")
                keyAlias System.getenv("A17_KEY_ALIAS") ?: "mcta17"
                keyPassword System.getenv("A17_KEYSTORE_PASSWORD")
            }
        }
    }

    buildFeatures {
        resValues true
    }

    androidResources {
        generateLocaleConfig true
    }

    buildTypes {
        release {
            if (System.getenv("A17_KEYSTORE")) {
                signingConfig signingConfigs.a17
            }
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
}

dependencies {
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.appcompat:appcompat:1.6.1"
}
